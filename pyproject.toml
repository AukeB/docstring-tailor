[project]
name = "docstring-tailor"
version = "0.4.1"
description = "Formats Python docstrings to PEP 257 style with configurable line length."
authors = [{ name = "Auke Bruinsma", email = "afbruinsma@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "libcst>=1.8.6",
    "typer>=0.26.4",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "prek>=0.3.8",
    "pyright>=1.1.414",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.6",
    "ty>=0.0.29",
]
presentation = [
    "marimo>=0.25.2",
    "pygments>=2.19.2",
]
presentation-pdf = [
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "playwright>=1.65.2",
]

[tool.uv]
# "presentation" is a default group so tests/test_presentation.py can run the notebook.
default-groups = ["dev", "presentation"]

[tool.ruff]
# Golden-file fixtures and the presentation's example modules are formatter inputs
# (some deliberately messy), not code to lint.
extend-exclude = ["tests/fixtures", "presentation/examples"]

[tool.ruff.lint]
select = [
    "I",    # isort-style import sorting
    "ANN",  # annotation rules
]

[tool.ruff.lint.isort]
known-first-party = ["docstring_tailor"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docstring_tailor"]

[tool.deptry]
known_first_party = ["docstring_tailor"]
# The marimo presentation is not part of the package; marimo lives in the "presentation" group.
extend_exclude = ["presentation"]

[project.scripts]
docstring_tailor = "docstring_tailor.main:app"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "I001"]  # tests are not held to annotation rules; two blank lines separate imports from section comments
"presentation/**" = ["ANN"]  # marimo cells are generated as unannotated "def _(mo):" functions
